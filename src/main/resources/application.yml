spring:
  application:
    name: parking-lot-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_lot}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    # Flyway manages the schema (PLS-045). Hibernate only validates that entities match the DB.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n%wEx"
  level:
    root: INFO
    tech.lokum.parkinglot: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
