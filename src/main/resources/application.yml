spring:
  application:
    name: parking-lot-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_lot}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    # Fine for a hackathon. Switch to validate once you add Flyway (PLS-045).
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n%wEx"
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:logs/parking-lot}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    tech.lokum.parkinglot: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
