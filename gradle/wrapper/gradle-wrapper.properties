distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://downloads.gradle.org/distributions/gradle-9.2.1-bin.zip
# Increased from 10000ms (10s) to 120000ms (2min).
# The Gradle 9.2.1 distribution zip is ~130MB and takes ~30-40s to download
# from services.gradle.org. The original 10s timeout was too short, causing
# SocketTimeoutException during Docker builds.
# See: https://docs.gradle.org/current/userguide/gradle_wrapper.html
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
